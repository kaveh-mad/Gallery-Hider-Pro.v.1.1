<style>
  :root{--accent:#4CAF50;--r:4px;--ok:#2e9e44;--err:#e53935}
  :root[data-shape="round"]{--r:14px}
  :root[data-theme="light"]{--bg1:#e8ecf5;--bg2:#cfd8ee;--card:#ffffff;--panel:#eef0f7;--line:#d3d8e6;--text:#1c1d2b;--muted:#5d6280;--input:#f6f7fb;--head:#2b3a67;--headtext:#cfd8ff}
  :root[data-theme="dark"]{--bg1:#0f0c29;--bg2:#302b63;--card:#1a1a2e;--panel:#23233a;--line:#3a3a56;--text:#f2f2f7;--muted:#a9a9c0;--input:#2a2a40;--head:#0f3460;--headtext:#a0c4ff}
  :root[data-theme="amoled"]{--bg1:#000;--bg2:#000;--card:#000;--panel:#111;--line:#2a2a2a;--text:#f2f2f7;--muted:#9a9aab;--input:#121212;--head:#0b0b0b;--headtext:#bdbdd0}

  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Roboto,sans-serif}
  body{background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px;color:var(--text)}
  .app{width:100%;max-width:480px;background:var(--card);border-radius:calc(var(--r) + 8px);overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,.25);border:1px solid var(--line)}

  header{background:var(--head);padding:20px 60px;text-align:center;position:relative;color:#fff}
  header h1{font-size:21px;margin-bottom:4px}
  header p{font-size:12.5px;color:var(--headtext)}
  .gear{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:var(--r);font-size:19px;cursor:pointer}
  .gear:hover{background:rgba(255,255,255,.2)}

  .body,.settings{padding:18px 18px 8px}
  .settings{display:none}
  .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:2px 0 8px;font-weight:600}
  html[dir="rtl"] .label{letter-spacing:0;font-size:12.5px}

  .btn{display:flex;align-items:center;justify-content:center;width:100%;height:46px;border:none;border-radius:var(--r);font-size:14.5px;font-weight:600;cursor:pointer;color:#fff;transition:filter .15s,transform .1s}
  .btn:hover:not(:disabled){filter:brightness(.92)}
  .btn:active:not(:disabled){transform:scale(.985)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--accent)}
  .btn-alt{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .btn+.btn{margin-top:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .grid2 .btn{margin:0}
  input[type=file]{display:none}

  .summary{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0 13px;height:42px;font-size:13px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:4px}
  .summary b{color:var(--text)}

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
  .tab{height:58px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;padding:0 4px;text-align:center}
  .tab small{font-weight:400;font-size:10.5px;opacity:.85;margin-top:2px}
  .tab:hover{border-color:var(--accent)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

  .panel{display:none;animation:fade .25s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .desc{font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:12px}
  .desc b{color:var(--text)}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .badge{font-size:11px;padding:4px 9px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .badge.good{color:var(--ok);border-color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
  .badge.warn{color:#e08600;border-color:rgba(224,134,0,.45)}

  .opts{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;margin-bottom:12px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:9px 0;font-size:13px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--line)}
  .opt:last-child{border-bottom:none}
  .opt input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
  .opt small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.5}
  .opt.disabled{opacity:.55;cursor:not-allowed}
  select,input[type=text],input[type=password]{width:100%;height:46px;padding:0 13px;border-radius:var(--r);border:1px solid var(--line);background:var(--input);color:var(--text);font-size:14.5px;margin-bottom:12px;outline:none}
  select:focus,input:focus{border-color:var(--accent)}
  .note{font-size:12px;line-height:1.6;color:var(--muted);border-inline-start:3px solid var(--accent);padding:6px 10px;margin-bottom:12px;background:var(--panel)}

  .progress{display:none;height:8px;background:var(--panel);border-radius:var(--r);overflow:hidden;margin:14px 0 4px}
  .progress div{height:100%;width:0;background:var(--accent);transition:width .2s}
  .status{display:none;margin-top:12px;padding:12px;border-radius:var(--r);font-size:13px;line-height:1.7;text-align:center}
  .status.ok{display:block;background:rgba(46,160,67,.14);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
  .status.err{display:block;background:rgba(220,53,69,.14);background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}

  details{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;font-size:13px;color:var(--text)}
  details>summary{cursor:pointer;font-weight:600;padding:12px 13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  details>summary::after{content:'＋';color:var(--accent)}
  details[open]>summary::after{content:'－'}
  details .inner{padding:12px 13px 13px;border-top:1px solid var(--line);line-height:1.75;color:var(--muted)}
  details .inner b{color:var(--text)}
  .inner ol,.inner ul{padding-inline-start:20px;margin:6px 0}
  .inner li{margin-bottom:8px}
  pre{background:#101018;color:#d6d6e7;border-radius:var(--r);padding:12px;overflow-x:auto;font-size:11.5px;line-height:1.5;margin:8px 0;border:1px solid #2a2a3c;direction:ltr;text-align:left}
  pre,code{font-family:ui-monospace,Menlo,Consolas,monospace}
  code{font-size:12px;color:var(--accent);direction:ltr;unicode-bidi:embed}
  pre code{color:inherit}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
  .seg.two{grid-template-columns:1fr 1fr}
  .seg button{height:42px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:var(--r);font-size:13px;cursor:pointer}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .sw{height:42px;border-radius:var(--r);border:2px solid transparent;cursor:pointer;outline:1px solid var(--line)}
  .sw.on{border-color:var(--text)}
  .crow{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;height:46px;margin-bottom:8px;font-size:13px}
  input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--line);border-radius:var(--r);background:none;margin:0;cursor:pointer}
  .sec-title{font-size:15px;font-weight:700;margin:22px 0 10px}

  .about{background:#3d3f42;border-radius:var(--r);margin:18px 0 12px;padding:30px 22px;text-align:center;color:#c9cacc}
  .about .by{font-size:12px;letter-spacing:.28em;color:#b4b6b9;margin-bottom:10px}
  html[dir="rtl"] .about .by{letter-spacing:0;font-size:13px}
  .about h2{font-family:Georgia,'Times New Roman',serif;font-size:36px;color:#4CAF50;font-weight:700;display:inline-block;padding-bottom:8px;border-bottom:4px solid #4CAF50;margin-bottom:18px;line-height:1.1}
  .about p{font-size:13.5px;line-height:1.95;color:#c9cacc}

  .flow{font-size:12px;line-height:1.75;color:var(--muted);margin:8px 0 4px}
  #pwModal{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:16px}
  .pwbox{width:100%;max-width:360px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .pwt{font-size:14px;font-weight:700;margin-bottom:12px;line-height:1.6}
  .pwerr{color:var(--err);font-size:12px;min-height:16px;margin-bottom:8px}
  .pwrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pwrow .btn{margin:0}
  .vbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
  .vbar .btn{height:40px;font-size:13px;margin:0}
  .vgroup{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin:12px 0 4px;font-size:13px;font-weight:700}
  .vgroup span.n{margin-inline-start:auto;font-weight:400;color:var(--muted);font-size:12px}
  .vrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
  .vrow input,.vgroup input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
  .vthumb{width:46px;height:46px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0}
  .vthumb img{width:100%;height:100%;object-fit:cover}
  .vinfo{min-width:0;flex:1;cursor:pointer}
  .vinfo .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
  .vinfo .mt{font-size:11.5px;color:var(--muted);margin-top:2px}
  .vempty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
  #preview{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.92);flex-direction:column;align-items:center;justify-content:center;padding:12px}
  #preview .pt{color:#fff;font-size:13px;margin-bottom:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
  #pvBody{max-width:100%;max-height:78vh;display:flex;align-items:center;justify-content:center}
  #pvBody img,#pvBody video{max-width:100%;max-height:78vh;border-radius:var(--r)}
  #preview .btn{width:auto;padding:0 22px;margin-top:14px}
  footer{text-align:center;padding:14px;font-size:11px;color:var(--muted);margin-top:18px;border-top:1px solid var(--line)}
  .hbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:74px;border:none;border-radius:var(--r);background:var(--accent);color:#fff;font-size:19px;font-weight:700;cursor:pointer;margin-bottom:8px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
  .hbtn .hic{font-size:28px;line-height:1}
  .hbtn b{background:rgba(255,255,255,.28);border-radius:999px;padding:2px 12px;font-size:15px;min-width:30px;text-align:center}
  .hbtn b:empty{display:none}
  .hbtn:active{transform:scale(.99)}
  .firstbox{background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);padding:14px;margin-bottom:14px}
  .firstbox .pwrow{margin-top:4px}
  #fldModal,#zipModal{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:14px}
  #fldModal{z-index:60}
  #zipModal{z-index:45}
  .zbox{max-width:480px;max-height:88vh;display:flex;flex-direction:column}
  #zList{overflow:auto;margin-bottom:12px;flex:1}
  .zrow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .zrow .zn{flex:1;min-width:0;direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zrow small{display:block;color:var(--muted);font-size:11px}
  .zrow button{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--r);cursor:pointer;font-size:12px}
  .fbtn{height:auto;min-height:58px;padding:10px;flex-direction:column;gap:3px;margin-bottom:8px;text-align:center}
  .fbtn small{font-weight:400;opacity:.75;font-size:11.5px}
  .vact{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--r);width:34px;height:34px;cursor:pointer;flex-shrink:0;font-size:15px}
  .vgroup .vact{margin-inline-start:0}
  .vthumb.big{width:112px;height:112px;font-size:40px}
  .tuth{font-size:16px;font-weight:700;margin:6px 0 12px}
  .tutc{display:flex;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
  .flow+.label{margin-top:16px}
  .tutn{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .tutc b{display:block;font-size:14px;margin-bottom:4px}
  .tutc p{margin:0;font-size:13px;line-height:1.8;color:var(--muted)}
</style>

<body>
<div class="app">
  <header>

  "aboutText": "Gallery Hider Pro உங்கள் புகைப்படங்கள், வீடியோக்கள், கோப்புகளின் தனிப்பட்ட நகலை கேலரியிலிருந்து விலக்கி, செயலிக்குள்ளேயே வைத்திருக்கும். புள்ளியில் தொடங்கும் பெயருடைய கோப்புறையையும் .nomedia-வையும், சுருக்கமில்லாத வேகமான ZIP-ஐ, அல்லது AES-256 குறியாக்கத்தைப் பயன்படுத்தலாம்; மறைக்கப்பட்ட கோப்புகள் பகுதிக்கோ தனித்தனி கோப்புகளுக்கோ கடவுச்சொல்லையும் சேர்க்கலாம். எல்லாம் உங்கள் சாதனத்திலேயே நடக்கும், எதுவும் பதிவேற்றப்படாது.",

  "destChosen": "கூடுதல் நகல் செல்லும் இடம்: {0}",
  "destClear": "இடத்தை நீக்கு",
  "destUnsupported": "இந்த உலாவியால் உங்கள் தொலைபேசியின் கோப்புறையில் எழுத இயலாது. Android செயலியால் முடியும். இப்போதைக்குப் பதிவிறக்க விருப்பத்தைப் பயன்படுத்துங்கள்.",
  "destDone": "{0} இலும் நகலெடுக்கப்பட்டது.",
  "flDest": "SD கார்டு உட்பட எந்தக் கோப்புறையையும் தேர்ந்தெடுக்கலாம். செயலி அதற்குள் உங்கள் மறைந்த கோப்புறையை உருவாக்கும்.",
  "fldTitle": "கோப்புறையைத் தேர்ந்தெடு",
  "fldIntro": "இந்த உலாவியால் முழு கோப்புறைகளைத் திறக்க இயலாது. இந்த வழிகளில் ஒன்றைத் தேர்ந்தெடுங்கள்:",
  "fldA": "கணினி கோப்புறைத் தேர்வி",
  "fldAs": "கணினிகள், iPhone மற்றும் சில தொலைபேசிகளில் செயல்படும்.",
  "fldB": "கோப்புறைக்குள் உள்ள கோப்புகளைத் தேர்ந்தெடு",
  "fldBs": "கோப்புறையைத் திறந்து, அனைத்தும் தேர்வு என்பதைத் தேர்ந்தெடுத்து, உறுதிசெய்யுங்கள்.",
  "fldC": "கோப்புறையின் ZIP-ஐத் தேர்ந்தெடு",
  "fldCs": "முதலில் உங்கள் Files செயலியில் கோப்புறையை ZIP ஆக்குங்கள். இந்தச் செயலி அதைப் பிரித்தெடுக்கும்.",
  "fldTipAndroid": "Android குறிப்பு: கோப்புத் தேர்வியில் கோப்புறையைத் திறந்து, ⋮ மெனுவைத் தொட்டு, அனைத்தும் தேர்வு என்பதைத் தேர்ந்தெடுத்து, பிறகு முடிந்தது என்பதைத் தொடுங்கள். Android செயலியால் முழு கோப்புறை மரங்களையும் தேர்ந்தெடுக்க முடியும்.",
  "fldTipIos": "iPhone குறிப்பு: கணினி கோப்புறைத் தேர்வியைத் தொட்டு, Files இல் கோப்புறையைத் தேர்ந்தெடுங்கள்.",
  "fldTipPc": "கணினி குறிப்பு: கோப்புறையை இந்தப் பக்கத்தில் எங்கு வேண்டுமானாலும் இழுத்து விடுங்கள், அல்லது கணினி கோப்புறைத் தேர்வியைப் பயன்படுத்துங்கள்.",
  "fldClose": "மூடு",
  "fldZipDone": "ZIP-இலிருந்து {0} கோப்பு(கள்) பிரித்தெடுக்கப்பட்டன.",
  "fldEmpty": "அந்தக் கோப்புறையில் கோப்புகள் எதுவும் இல்லை.",
  "tutTitle": "Gallery Hider Pro ஐ எப்படிப் பயன்படுத்துவது",
  "tutH1": "இந்தச் செயலி என்ன செய்கிறது",
  "tutP1": "Gallery Hider Pro உங்கள் புகைப்படங்கள், வீடியோக்கள், ஆவணங்களின் தனிப்பட்ட நகலை செயலிக்குள் வைத்திருக்கும்; இதனால் அவை கேலரியில் தெரியாது. இது இணையமின்றிச் செயல்படும், எதுவும் பதிவேற்றப்படாது.",
  "tutH2": "படி 1 · எதை மறைப்பது எனத் தேர்ந்தெடுங்கள்",
  "tutP2": "படங்கள் & வீடியோக்கள், எந்தக் கோப்பும் அல்லது கோப்புறை என்பதைத் தொடுங்கள். உங்கள் தொலைபேசியில் கோப்புறைகளைத் திறக்க முடியாவிட்டால், கோப்புறை பொத்தான் வேறு வழிகளைத் தரும்: கோப்புறைக்குள் உள்ள கோப்புகளைத் தேர்ந்தெடுக்கலாம், அல்லது கோப்புறையின் ZIP-ஐத் தேர்ந்தெடுக்கலாம்.",
  "tutH3": "படி 2 · முறையைத் தேர்ந்தெடுங்கள்",
  "tutP3": "புள்ளி: புள்ளியில் தொடங்கும் பெயருடைய கோப்புறை, கூடவே .nomedia. விரைவானது, எளிமையானது. ZIP: சுருக்கமில்லாத ஒரு வேகமான ZIP, விருப்ப AES-256 கடவுச்சொல்லுடன். AES-256: ஒவ்வொரு கோப்பும் குறியாக்கப்படும், கடவுச்சொல் தேவை.",
  "tutH4": "படி 3 · பச்சை பொத்தானைத் தொடுங்கள்",
  "tutP4": "ஒரு நகல் செயலிக்குள் சென்று மறைந்த கோப்புகளில் தோன்றும். இரண்டாவது நகலை உங்கள் தொலைபேசியின் கோப்புறையிலோ SD கார்டிலோ சேமிக்கலாம், அல்லது ஒன்றைப் பதிவிறக்கலாம்.",
  "tutH5": "படி 4 · மூலக் கோப்புகளை நீக்குங்கள்",
  "tutP5": "இணையப் பக்கத்தால் கேலரியிலிருந்து கோப்புகளை நீக்க இயலாது. மூலக் கோப்புகளை நீங்களே நீக்கி, பிறகு குப்பை அல்லது சமீபத்தில் நீக்கியவை ஆல்பத்தைக் காலி செய்யுங்கள்; இல்லையெனில் படங்கள் திரும்பி வரக்கூடும்.",
  "tutH6": "மறைந்த கோப்புகள்",
  "tutP6": "பெரிய பொத்தானால் திறக்கலாம். பட்டியலைக் காட்டு என்பதைத் தொடும் வரை பட்டியல் சுருக்கப்பட்டே இருக்கும். சிறிய அல்லது பெரிய முன்னோட்டங்களைத் தேர்ந்தெடுக்கலாம், அல்லது எதுவும் வேண்டாம் எனலாம். புகைப்படம், வீடியோ அல்லது ஒலியைத் தொட்டுப் பார்க்கலாம்.",
  "tutH7": "கடவுச்சொற்கள்",
  "tutP7": "முழுப் பகுதியையும் ஒரே கடவுச்சொல்லால் பாதுகாக்கலாம் (இயல்பாக முடக்கம்); தனித்தனி கோப்புகளுக்கும் தனி கடவுச்சொல் தரலாம். மறந்த கடவுச்சொல்லை மீட்க முடியாது.",
  "tutH8": "ZIP-க்குள் பாருங்கள்",
  "tutP8": "பட்டியலில் ஒரு ZIP-ஐத் தொட்டால் அதில் என்ன உள்ளது எனப் பார்க்கலாம், அதிலிருந்து புகைப்படம் அல்லது வீடியோவைத் திறக்கலாம், அல்லது சேமிக்கலாம். கடவுச்சொல் உள்ள ZIP முதலில் கடவுச்சொல்லைக் கேட்கும்.",
  "tutH9": "மறுபெயரிடு, நகர்த்து, SD கார்டு",
  "tutP9": "கோப்பை மறுபெயரிடலாம்; அல்லது கோப்புறைக்கு அருகிலுள்ள பென்சிலைப் பயன்படுத்தி, அதன் பாதையை மாற்றி மறுபெயரிடலாம் அல்லது நகர்த்தலாம், எடுத்துக்காட்டாக Work/.Private. கூடுதல் நகலுக்கான இடமாக SD கார்டிலுள்ள ஒரு கோப்புறையைத் தேர்ந்தெடுங்கள்.",
  "tutH10": "காப்புப்பிரதியும் பாதுகாப்பும்",
  "tutP10": "அவ்வப்போது காப்புப்பிரதியை ஏற்றுமதி செய்யுங்கள். செயலித் தரவை அழித்தாலோ நிறுவல் நீக்கினாலோ மறைந்த கோப்புகள் அழிந்துவிடும். உங்கள் கடவுச்சொற்களைப் பாதுகாப்பான இடத்தில் வைத்திருங்கள்.",
  "destPass": "கூடுதல் நகலுக்கான கடவுச்சொல் (கோப்புறை பூட்டப்பட்டே இருக்கும்)",
  "destNeedPass": "முதலில் கூடுதல் நகலுக்கு ஒரு கடவுச்சொல்லை (குறைந்தது 6 எழுத்துகள்) உள்ளிடவும்.",
  "selClear": "தேர்வை அழி",
  "fldReading": "கோப்புறை படிக்கப்படுகிறது…"
 },

  "by": "రూపకర్త",
  "aboutText": "Gallery Hider Pro మీ ఫోటోలు, వీడియోలు, ఫైళ్ల ప్రైవేట్ కాపీని గ్యాలరీకి దూరంగా యాప్ లోపల ఉంచుతుంది. .nomedia ఉన్న చుక్కతో మొదలయ్యే ఫోల్డర్‌ను, కంప్రెషన్ లేని వేగవంతమైన ZIPను లేదా AES-256 ఎన్‌క్రిప్షన్‌ను వాడండి, అలాగే దాచిన ఫైళ్ల విభాగానికి లేదా ఒక్కో ఫైల్‌కు పాస్‌వర్డ్ జోడించండి. అంతా మీ పరికరంలోనే జరుగుతుంది, ఏదీ అప్‌లోడ్ కాదు.",

const LANGS = [['en','English'],['fa','پارسی'],['zh','中文'],['hi','हिन्दी'],['es','Español'],['fr','Français'],['pt','Português'],['ru','Русский'],['bn','বাংলা'],['ur','اردو'],['id','Bahasa Indonesia'],['de','Deutsch'],['ja','日本語'],['tr','Türkçe'],['ko','한국어'],['he','עברית'],['vi','Tiếng Việt'],['it','Italiano'],['th','ไทย'],['pl','Polski'],['uk','Українська'],['nl','Nederlands'],['hy','Հայերեն'],['sw','Kiswahili'],['ta','தமிழ்'],['te','తెలుగు'],['mr','मराठी'],['el','Ελληνικά'],['ro','Română'],['cs','Čeština'],['sv','Svenska']];
const RTL = {fa: 1, he: 1, ur: 1};

const DEFAULTS = {lang:'en', theme:'light', accent:'#4CAF50', head:'', bg:'', shape:'rect'};
const PALETTES = [
  ['#4CAF50','#2e7d32'], ['#2196F3','#0d47a1'], ['#7C4DFF','#311b92'], ['#FF9800','#e65100'],
  ['#E91E63','#880e4f'], ['#00ACC1','#006064'], ['#F44336','#b71c1c'], ['#607D8B','#263238']
];
let settings = {...DEFAULTS};
try { Object.assign(settings, JSON.parse(localStorage.getItem('ghp-v4') || '{}')); } catch(e){}
if (!T[settings.lang]) settings.lang = 'en';

function t(k, ...a){ const L = T[settings.lang]; const v = (L && L[k] !== undefined) ? L[k] : T.en[k]; if (v === undefined) return k; return a.length ? v.replace(/\{(\d)\}/g, (m, n) => a[+n]) : v; }
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function hex(v){ v = (v||'').trim(); return /^#[0-9a-f]{6}$/i.test(v) ? v : '#000000'; }
function setOrClear(n, v){ v ? document.documentElement.style.setProperty(n, v) : document.documentElement.style.removeProperty(n); }

function applySettings(){
  const r = document.documentElement, s = settings;
  r.dataset.theme = s.theme; r.dataset.shape = s.shape;
  r.style.setProperty('--accent', s.accent);
  setOrClear('--head', s.head); setOrClear('--bg1', s.bg); setOrClear('--bg2', s.bg);
  const cs = getComputedStyle(r);
  $('cAccent').value = hex(s.accent);
  $('cHead').value = hex(cs.getPropertyValue('--head'));
  $('cBg').value = hex(cs.getPropertyValue('--bg1'));
  document.querySelectorAll('#segTheme button').forEach(b => b.classList.toggle('on', b.dataset.v === s.theme));
  document.querySelectorAll('#segShape button').forEach(b => b.classList.toggle('on', b.dataset.v === s.shape));
  document.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x.dataset.a.toLowerCase() === s.accent.toLowerCase()));
  try { localStorage.setItem('ghp-v4', JSON.stringify(s)); } catch(e){}
}

function renderTut(){
  const bx = $('tutBody'); bx.textContent = '';
  const hd = mk('div', 'tuth'); hd.textContent = t('tutTitle'); bx.appendChild(hd);
  for (let i = 1; i <= 10; i++) {
    const c = mk('div', 'tutc'), n = mk('span', 'tutn'), b = mk('div'), a = mk('b'), p = mk('p');
    n.textContent = i; a.textContent = t('tutH' + i); p.textContent = t('tutP' + i);
    b.appendChild(a); b.appendChild(p); c.appendChild(n); c.appendChild(b); bx.appendChild(c);
  }
}
LANGS.filter(l => T[l[0]]).forEach(l => { const o = document.createElement('option'); o.value = l[0]; o.textContent = l[1]; $('langSel').appendChild(o); });

function applyLang(){
  const r = document.documentElement, L = settings.lang;
  r.lang = L; r.dir = RTL[L] ? 'rtl' : 'ltr';
  $('langSel').value = L;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(e => e.innerHTML = t(e.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  renderSummary(); renderDecSummary(); clearResult(); renderTut(); renderDest();
  if (curView === 'vault') { renderLockBox(); renderVault(); }
  updateVaultCount();
}

PALETTES.forEach(([a, h]) => {
  const b = document.createElement('button');
  b.className = 'sw'; b.dataset.a = a; b.title = a;
  b.style.background = `linear-gradient(135deg, ${a} 50%, ${h} 50%)`;
  b.onclick = () => { settings.accent = a; settings.head = h; applySettings(); };
  $('swatches').appendChild(b);
});
$('cAccent').oninput = e => { settings.accent = e.target.value; applySettings(); };
$('cHead').oninput = e => { settings.head = e.target.value; applySettings(); };
$('cBg').oninput = e => { settings.bg = e.target.value; applySettings(); };
$('resetColors').onclick = () => { settings.accent = DEFAULTS.accent; settings.head = ''; settings.bg = ''; applySettings(); };
$('resetAll').onclick = () => { settings = {...DEFAULTS}; applySettings(); applyLang(); };
document.querySelectorAll('#segTheme button').forEach(b => b.onclick = () => { settings.theme = b.dataset.v; applySettings(); });
document.querySelectorAll('#segShape button').forEach(b => b.onclick = () => { settings.shape = b.dataset.v; applySettings(); });
$('langSel').onchange = e => { settings.lang = e.target.value; applySettings(); applyLang(); };

let curView = 'main';
function showView(v){
  curView = v;
  $('mainView').style.display = v === 'main' ? 'block' : 'none';
  $('settingsView').style.display = v === 'settings' ? 'block' : 'none';
  $('vaultView').style.display = v === 'vault' ? 'block' : 'none';
  $('gearBtn').textContent = v === 'main' ? '⚙' : '✕';
  window.scrollTo({top:0});
  vOpen = false;
  if (v === 'vault') openVaultView(); else { closePreview(); closeZip(); }
}
$('gearBtn').onclick = () => showView(curView === 'main' ? 'settings' : 'main');

document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === tb));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tb.dataset.tab));
  clearResult();
}));

function fmt(n){ const u=['B','KB','MB','GB']; let i=0; while(n>=1024&&i<3){n/=1024;i++} return n.toFixed(i?1:0)+' '+u[i]; }
function renderSummary(){
  $('summary').innerHTML = files.length ? t('count', files.length, fmt(files.reduce((s,f)=>s+f.size,0))) : t('noFiles');
  $('selClearBtn').style.display = files.length ? 'flex' : 'none';
}
function renderDecSummary(){
  $('decSummary').innerHTML = decFiles.length ? t('decCount', decFiles.length) : t('noEnc');
}
function onPick(e){ const a = Array.from(e.target.files); e.target.value = ''; if (a.length) setFiles(a); }
$('fileInput').addEventListener('change', onPick);
$('folderInput').addEventListener('change', onPick);
['mediaLbl', 'fileLbl'].forEach(id => $(id).addEventListener('click', e => {
  if (window.Android && window.Android.pickFiles) { e.preventDefault(); window.Android.pickFiles(id === 'mediaLbl' ? 'media' : 'any'); }
}));
$('mediaInput').addEventListener('change', onPick);
$('decInput').addEventListener('change', e => { decFiles = Array.from(e.target.files); renderDecSummary(); });

function setProgress(p){ $('progress').style.display='block'; $('bar').style.width=p+'%'; }
function showStatus(msg, ok=true){ const s=$('status'); s.className='status '+(ok?'ok':'err'); s.innerHTML=msg; }
function clearResult(){ $('status').className='status'; $('progress').style.display='none'; $('bar').style.width='0'; $('downloadBtn').style.display='none'; }
function offerDownload(blob, name){
  const b = $('downloadBtn'); b.style.display='flex'; b.textContent = t('download') + name;
  b.onclick = () => saveBlob(blob, name);
}
async function saveBlob(blob, name){
  if (window.Android && window.Android.saveDownload) {
    const CHK = 1 << 20;
    for (let pos = 0, first = true; pos < blob.size || first; pos += CHK, first = false) {
      window.Android.saveDownload(name, blob.type || 'application/octet-stream', await blobB64(blob.slice(pos, pos + CHK)), !first);
    }
    window.Android.finishDownload();
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function safeName(s, fallback){ s = (s||'').trim().replace(/[\\/:*?"<>|]/g,''); return s || fallback; }
function fullPath(f){ return f._rel || f.webkitRelativePath || f.name; }
function relPath(f){ const p = f._rel || f.webkitRelativePath; return p ? (p.split('/').slice(1).join('/') || f.name) : f.name; }
function transformPath(path, o){
  const parts = path.split('/'); let n = parts.pop();
  if (o.prefix && !n.startsWith('.')) n = '.' + n;
  if (o.disguise) n += '.dat';
  return [...parts, n].join('/');
}

const te = new TextEncoder(), td = new TextDecoder();
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptFile(file, pass, iter){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt, iter);
  const name = te.encode(relPath(file));
  const data = new Uint8Array(await blobBuf(file));
  const plain = new Uint8Array(2 + name.length + data.length);
  new DataView(plain.buffer).setUint16(0, name.length);
  plain.set(name, 2); plain.set(data, 2 + name.length);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plain));
  const out = new Uint8Array(32 + ct.length);
  new DataView(out.buffer).setUint32(0, iter);
  out.set(salt, 4); out.set(iv, 20); out.set(ct, 32);
  return out;
}
async function decryptBuffer(buf, pass){
  const u = new Uint8Array(buf);
  const iter = new DataView(u.buffer, u.byteOffset).getUint32(0);
  const key = await deriveKey(pass, u.slice(4,20), iter);
  const plain = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(20,32)}, key, u.slice(32)));
  const n = new DataView(plain.buffer).getUint16(0);
  return { name: td.decode(plain.slice(2, 2+n)), data: plain.slice(2+n) };
}

async function runDot(dl, pw){
  const folder = cleanPath($('folderName').value) || '.Private';
  const o = {prefix: $('dotFiles').checked, disguise: $('dotDisguise').checked};
  const own = pw ? await makeOwn(pw, 250000) : null;
  const zip = dl ? new JSZip() : null;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const path = folder + '/' + transformPath(relPath(f), o);
    await vSave(path, f, {own});
    if (zip) zip.file(path, f, {compression: 'STORE'});
    setProgress(5 + (i + 1) / files.length * 85);
  }
  if ($('dotNomedia').checked) {
    await vSave(folder + '/.nomedia', new Blob([]), {type: 'application/octet-stream', rec: {hidden: true}});
    if (zip) zip.file(folder + '/.nomedia', '');
  }
  if (!zip) return null;
  return {blob: await zip.generateAsync({type: 'blob', compression: 'STORE', streamFiles: true}), name: safeName(baseName(folder).replace(/^\./, ''), 'private') + '-hidden.zip'};
}

async function runZip(dl, pw){
  const base = ($('zipDot').checked ? '.' : '') + safeName($('zipName').value, 'hidden-files') + '.zip';
  let blob;
  if (pw) {
    blob = await AESZ.build(files.map(f => ({name: relPath(f), file: f})), pw, $('zipNomedia').checked, p => setProgress(5 + p * 85));
  } else {
    const zip = new JSZip();
    files.forEach(f => zip.file(relPath(f), f, {compression: 'STORE'}));
    if ($('zipNomedia').checked) zip.file('.nomedia', '');
    blob = await zip.generateAsync({type: 'blob', compression: 'STORE', streamFiles: true}, m => setProgress(5 + m.percent * 0.85));
  }
  await vSave(base, blob, {type: 'application/zip'});
  const inSize = files.reduce((s, f) => s + f.size, 0);
  let info = t('storeCheck', fmt(inSize), fmt(blob.size));
  if (pw) info += '<br>' + t('zipPwOk');
  if (!dl) return {info};
  const camoOn = $('zipCamo').value !== 'none';
  if (camoOn) info += '<br>' + t('tipCamo');
  return {blob, name: camo($('zipCamo').value, base), info};
}

async function runEnc(dl, pw){
  const iter = parseInt($('encIter').value, 10);
  const own = await makeOwn(pw, iter);
  const zip = dl ? new JSZip() : null;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    await vSave(fullPath(f), f, {own});
    if (zip) zip.file(String(i + 1).padStart(4, '0') + '.enc', await encryptFile(f, pw, iter), {compression: 'STORE'});
    setProgress(5 + (i + 1) / files.length * 85);
  }
  if ($('encNomedia').checked) {
    await vSave('.nomedia', new Blob([]), {type: 'application/octet-stream', rec: {hidden: true}});
    if (zip) zip.file('.nomedia', '');
  }
  if (!zip) return null;
  const camoOn = $('encCamo').value !== 'none';
  return {blob: await zip.generateAsync({type: 'blob', compression: 'STORE', streamFiles: true}), name: camo($('encCamo').value, 'encrypted-files.zip'), info: camoOn ? t('tipCamo') : ''};
}

async function run(method){
  clearResult();
  if (!files.length) return showStatus(t('selectFirst'), false);
  const pw = {dot: $('dotPass').value, zip: $('zipPass').value, enc: $('encPass').value}[method];
  if ((method === 'enc' || pw) && pw.length < 6) return showStatus(t('passMin'), false);
  if ((method === 'enc' || pw) && !(window.crypto && crypto.subtle)) return showStatus(t('cryptoCtx'), false);
  if (typeof JSZip === 'undefined') return showStatus(t('jszipFail'), false);
  if (dest && !dest.handle && !(window.Android && window.Android.writeChunk)) return showStatus(t('destUnsupported'), false);
  if (dest && $('destPass').value.length < 6) return showStatus(t('destNeedPass'), false);
  if (dest && !(window.crypto && crypto.subtle)) return showStatus(t('cryptoCtx'), false);
  try {
    setProgress(3);
    await prepVault();
    const dl = $(method + 'Dl').checked, n = files.length;
    const out = await {dot: runDot, zip: runZip, enc: runEnc}[method](dl, pw);
    if (dest) await destLocked($('destPass').value);
    setProgress(100);
    await updateVaultCount();
    let msg = t('vAdded', n) + '<br><span style="opacity:.85">' + t('vAddedHint') + '</span><br><a href="#" style="color:inherit;text-decoration:underline" onclick="showView(\'vault\');return false">' + t('vOpenLink') + '</a>';
    if (dest) msg += '<br><span style="opacity:.85">' + t('destDone', dest.name) + '</span>';
    if (out && out.info) msg += '<br><span style="opacity:.85">' + out.info + '</span>';
    showStatus(msg);
    if (out && out.blob) offerDownload(out.blob, out.name);
    files = []; renderSummary();
  } catch (err) {
    console.error(err);
    $('progress').style.display = 'none';
    showStatus(t('errPrefix') + (err.message || err), false);
  }
}

async function decrypt(){
  clearResult();
  const pass = $('decPass').value;
  if (!decFiles.length) return showStatus(t('selEncFirst'), false);
  if (!pass) return showStatus(t('enterPass'), false);
  try {
    const out = new JSZip();
    setProgress(3);
    for (let i = 0; i < decFiles.length; i++) {
      const { name, data } = await decryptBuffer(await blobBuf(decFiles[i]), pass);
      out.file(name, data, {compression:'STORE'});
      setProgress(5 + (i + 1) / decFiles.length * 85);
    }
    const blob = await out.generateAsync({type:'blob', compression:'STORE'});
    setProgress(100);
    offerDownload(blob, 'restored-files.zip');
    showStatus(t('restored', decFiles.length));
  } catch (err) {
    $('progress').style.display = 'none';
    showStatus(t('wrongPass'), false);
  }
}

function camo(val, normal){
  if (val === 'cache') return '.thumbdata4--' + (Math.floor(Math.random() * 9e9) + 1e9);
  if (val === 'backup') return '.sys_cache.dat';
  return normal;
}

function fileKey(f){ return fullPath(f) + '|' + f.size + '|' + (f.lastModified || 0); }
function setFiles(arr){
  const seen = new Set(files.map(fileKey));
  arr.forEach(f => { const k = fileKey(f); if (!seen.has(k)) { seen.add(k); files.push(f); } });
  renderSummary(); clearResult();
}
function clearFiles(){ files = []; renderSummary(); clearResult(); }
function blobBuf(b){
  if (b.arrayBuffer) return b.arrayBuffer();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(b); });
}
async function walkDir(dir, prefix, out){
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'file') { const f = await h.getFile(); Object.defineProperty(f, '_rel', {value: prefix + '/' + name}); out.push(f); }
    else await walkDir(h, prefix + '/' + name, out);
  }
}
const IS_PHONE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    const lh = new DataView(await blobBuf(blob.slice(en.off, en.off + 30)));
    const start = en.off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    if (en.method === 0) return blob.slice(start, start + en.csize);
    if (en.method === 99) {
      const raw = new Uint8Array(await blobBuf(blob.slice(start, start + en.csize)));
      const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveBits']);
      const k = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt: raw.slice(0, 16), iterations: 1000, hash: 'SHA-1'}, base, 66 * 8));
      if (k[64] !== raw[16] || k[65] !== raw[17]) throw new Error(t('vWrong'));
      const data = raw.slice(18, raw.length - 10);
      AESZ.ctrXor(AESZ.expand(k.subarray(0, 32)), data, 1);
      return new Blob([data]);
    }
    if (jzBlob !== blob) { jz = await JSZip.loadAsync(blob); jzBlob = blob; }
    return jz.file(en.name).async('blob');
  }
  return {list, get};
})();

async function zipPassword(blob, list, known){
  const en = list.find(x => x.method === 99);
  if (!en) return '';
  if (known) return known;
  for (let k = 0; k < 3; k++) {
    const p = await askPassword({title: t(k ? 'vWrong' : 'zPassTitle')});
    if (p === null) return null;
    try { await ZR.get(blob, en, p); return p; } catch (e) {}
  }
  return null;
}
const zipPw = new Map();
async function browseZip(r){
  try {
    const blob = await decBlob(r);
    let list;
    try { list = (await ZR.list(blob)).filter(x => !/\/$/.test(x.name)); } catch (e) { return say('vStatus', t('zBad'), false); }
    const pw = await zipPassword(blob, list, zipPw.get(r.id));
    if (pw === null) return;
    if (pw) zipPw.set(r.id, pw);
    const box = $('zList'); box.textContent = '';
    $('zHead').textContent = r.name + ' · ' + t('zItems', list.length);
    if (!list.length) { const d = mk('div', 'vempty'); d.textContent = t('zEmpty'); box.appendChild(d); }
    list.forEach(en => {
      const row = mk('div', 'zrow'), nm = mk('div', 'zn'), sm = mk('small'), type = guessType({name: baseName(en.name), type: ''});
      nm.textContent = en.name; sm.textContent = fmt(en.size); nm.appendChild(sm); row.appendChild(nm);
      const act = async save => {
        try {
          const b = await ZR.get(blob, en, pw), tb = new Blob([b], {type});
          if (!save && showMedia(baseName(en.name), tb, type)) return;
          saveBlob(tb, baseName(en.name));
        } catch (e) { say('vStatus', t('errPrefix') + (e.message || e), false); }
      };
      if (/^(image|video|audio)\//.test(type)) { const ob = mk('button'); ob.textContent = t('zOpen'); ob.onclick = () => act(false); row.appendChild(ob); }
      const sb = mk('button'); sb.textContent = t('zSave'); sb.onclick = () => act(true); row.appendChild(sb);
      box.appendChild(row);
    });
    $('zipModal').style.display = 'flex';
  } catch (e) { say('vStatus', t('errPrefix') + (e.message || e), false); }
}
function closeZip(){ $('zipModal').style.display = 'none'; }

async function renameSelected(){
  if (selected.size !== 1) return say('vStatus', t('vSelOne'), false);
  const rec = await VDB.get(Array.from(selected)[0]);
  const v = await askPassword({title: t('vRenameTitle'), text: rec.path}); if (v === null) return;
  const p = cleanPath(v); if (!p) return;
  rec.path = p; rec.name = baseName(p); await VDB.put(rec);
  say('vStatus', t('vRenamed')); renderVault();
}
async function renameGroup(d){
  const v = await askPassword({title: t('vRenameFolder'), text: d}); if (v === null) return;
  const nd = cleanPath(v); if (!nd || nd === d) return;
  const all = await VDB.all();
  for (const r of all) if (r.path === d || r.path.startsWith(d + '/')) { r.path = nd + r.path.slice(d.length); r.name = baseName(r.path); await VDB.put(r); }
  say('vStatus', t('vRenamed')); renderVault();
}

async function chooseDest(){
  try {
    if (window.Android && window.Android.pickDestination) { window.Android.pickDestination(); return; }
    if (window.showDirectoryPicker) { const dh = await window.showDirectoryPicker({mode: 'readwrite'}); dest = {handle: dh, name: dh.name}; }
    else return showStatus(t('destUnsupported'), false);
    renderDest();
  } catch (e) { if (!e || e.name !== 'AbortError') showStatus(t('errPrefix') + (e.message || e), false); }
}
window.onDestPicked = function(name){ dest = {name: name}; renderDest(); };
function clearDest(){ dest = null; renderDest(); }
function renderDest(){
  $('destInfo').textContent = dest ? t('destChosen', dest.name) : t('destNone');
  $('destClear').style.display = dest ? 'flex' : 'none';
  $('destPass').style.display = dest ? 'block' : 'none';
}
function blobB64(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
async function destLocked(pass){
  const folder = cleanPath($('folderName').value) || '.Private', tag = Date.now().toString(36);
  await destWrite(folder + '/.nomedia', new Blob([]));
  for (let i = 0; i < files.length; i++) {
    await destWrite(folder + '/' + tag + '-' + String(i + 1).padStart(4, '0') + '.enc', new Blob([await encryptFile(files[i], pass, 250000)]));
    setProgress(90 + (i + 1) / files.length * 9);
  }
}
async function destWrite(path, blob){
  if (dest.handle) {
    const parts = path.split('/').filter(Boolean); let d = dest.handle;
    for (let i = 0; i < parts.length - 1; i++) d = await d.getDirectoryHandle(parts[i], {create: true});
    const fh = await d.getFileHandle(parts[parts.length - 1], {create: true}), w = await fh.createWritable();
    await w.write(blob); await w.close();
    return;
  }
  const CHK = 1 << 20;
  for (let pos = 0, first = true; pos < blob.size || first; pos += CHK, first = false) {
    window.Android.writeChunk(path, await blobB64(blob.slice(pos, pos + CHK)), !first);
  }
}

const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
function fldOpen(){ $('fldTip').textContent = t(IS_IOS ? 'fldTipIos' : IS_PHONE ? 'fldTipAndroid' : 'fldTipPc'); $('fldModal').style.display = 'flex'; }
function fldClose(){ $('fldModal').style.display = 'none'; }
function fldDo(k){ fldClose(); $(k === 'dir' ? 'folderInput' : k === 'files' ? 'fileInput' : 'zipInput').click(); }
$('zipInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const list = (await ZR.list(f)).filter(x => !/\/$/.test(x.name));
    const pw = await zipPassword(f, list, '');
    if (pw === null) return;
    const root = f.name.replace(/\.zip$/i, '') || 'folder', out = [];
    for (const en of list) {
      const b = await ZR.get(f, en, pw), nm = baseName(en.name);
      const file = new File([b], nm, {type: guessType({name: nm, type: ''})});
      Object.defineProperty(file, '_rel', {value: root + '/' + en.name}); out.push(file);
    }
    if (!out.length) return showStatus(t('fldEmpty'), false);
    setFiles(out); showStatus(t('fldZipDone', out.length));
  } catch (err) { showStatus(t('zBad'), false); }
});
function entryFiles(entry, prefix, out){
  return new Promise(res => {
    if (entry.isFile) { entry.file(f => { Object.defineProperty(f, '_rel', {value: prefix + entry.name}); out.push(f); res(); }, () => res()); return; }
    const rd = entry.createReader(), all = [];
    const next = () => rd.readEntries(async es => {
      if (!es.length) { for (const x of all) await entryFiles(x, prefix + entry.name + '/', out); res(); }
      else { all.push(...es); next(); }
    }, () => res());
    next();
  });
}
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault();
  const items = e.dataTransfer && e.dataTransfer.items; if (!items) return;
  const ents = [], out = [];
  for (let i = 0; i < items.length; i++) { const en = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry(); if (en) ents.push(en); }
  for (const en of ents) await entryFiles(en, '', out);
  if (out.length) { setFiles(out); showView('main'); }
});
$('vViewSel').onchange = e => { vMode = e.target.value; lsSet('ghp-vmode', vMode); renderVault(); };
